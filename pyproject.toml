[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptobot"
version = "0.1.0"
description = "Bot de trading de criptomonedas: backtest, paper trading y estrategias enchufables."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "eniquecerrud" }]
keywords = ["crypto", "trading", "backtest", "ccxt", "paper-trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "ccxt>=4.4",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
cryptobot = "cryptobot.cli:main"

[project.urls]
Homepage = "https://github.com/eniquecerrud/crypto-trading-bot"
Repository = "https://github.com/eniquecerrud/crypto-trading-bot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cryptobot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["cryptobot", "tests"]
